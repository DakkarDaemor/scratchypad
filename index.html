<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>ScratchyPad</title>
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/png" href="%BASE_URL%logo.png" />
    <meta name="theme-color" content="#2a2825" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ScratchyPad" />
    <script src="https://accounts.google.com/gsi/client" async></script>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; }

      #portrait-gate {
        display: none;
        position: fixed;
        inset: 0;
        background: #2a2825;
        color: #f7f6f4;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: 'DM Sans', sans-serif;
        text-align: center;
        padding: 32px;
        box-sizing: border-box;
      }
      #portrait-gate .pg-icon { font-size: 52px; }
      #portrait-gate .pg-msg { margin: 0; font-size: 15px; opacity: 0.75; line-height: 1.5; }

      @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
        #portrait-gate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="portrait-gate">
      <div class="pg-icon">↺</div>
      <p class="pg-msg">Ruota il dispositivo in verticale<br>per usare ScratchyPad</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
